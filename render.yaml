# Render Blueprint - Infrastructure as Code
# This file configures all services for one-click deployment on Render.com

services:
  # Spring Boot Backend API
  - type: web
    name: smartsupply-api
    runtime: docker
    dockerfilePath: ./backend-java/Dockerfile
    dockerContext: ./backend-java
    plan: free
    envVars:
      - key: POSTGRES_USER
        fromDatabase:
          name: smartsupply-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: smartsupply-db
          property: password
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: smartsupply-db
          property: connectionString
          # Render provides postgres:// but Spring needs jdbc:postgresql://
          # You'll need to set this manually as: jdbc:postgresql://HOST:PORT/DB_NAME
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false  # Set manually after deploying frontend
      - key: GEMINI_API_KEY
        sync: false  # Set manually

databases:
  - name: smartsupply-db
    plan: free
    databaseName: smartsupply_db
    user: smartsupply
