# Render Blueprint - Infrastructure as Code
# NOTE: This is a reference file. The actual deployment was done manually via the Render UI.
# To use this for one-click deploy: Dashboard -> New -> Blueprint -> Connect Repo

services:
  # Spring Boot Backend API
  - type: web
    name: smartsupply-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    rootDir: backend-java
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false  # Set manually: jdbc:postgresql://HOST:5432/smartsupply_db
      - key: POSTGRES_USER
        sync: false  # Set manually from DB info page
      - key: POSTGRES_PASSWORD
        sync: false  # Set manually from DB info page
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false  # Set to your Vercel frontend URL after deploying
      - key: GEMINI_API_KEY
        sync: false  # Your Gemini API key (optional)

databases:
  - name: smartsupply-db
    plan: free
    databaseName: smartsupply_db
    user: smartsupply
